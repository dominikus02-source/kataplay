name: kataplay_2
description: "KataPlay - Petualangan Bahasa Indonesia yang Menyenangkan untuk anak usia 4-10 tahun"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local Storage (Offline First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.7.0
  smooth_page_indicator: ^1.2.0

  # Icons & Assets
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/Splashscreen_kataplay.png
    - assets/icon_kataplay.png
    - assets/onboarding_kataplay.png
    - assets/images/
    - assets/characters/
    - assets/animations/
    - assets/sample_lessons/
    - assets/curriculum/

  # Note: For production, download Fredoka & Nunito fonts and add to assets/fonts
  # For MVP we use google_fonts package (easy & beautiful)
